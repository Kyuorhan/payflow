<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Definições para sombras e temas -->
  <defs>
    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    
    <!-- Gradiente para fundo light -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente para fundo dark -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo com gradiente e sombra -->
  <rect width="64" height="64" rx="12" fill="url(#bgLight)" 
        stroke="#e5e5e5" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Logo oficial do Figma centralizado -->
  <g transform="translate(32, 28) ">
    <!-- Left Column -->
    <!-- Red Rectangle (top-left) -->
    <rect x="-12" y="-12" width="12" height="12" rx="6" fill="#F24E1E"/>
    
    <!-- Orange Rectangle (middle-left) -->
    <rect x="-12" y="0" width="12" height="12" rx="6" fill="#FF7262"/>
    
    <!-- Green Circle (bottom-left) -->
    <circle cx="-6" cy="18" r="6" fill="#0ACF83"/>
    
    <!-- Right Column -->
    <!-- Violet Rectangle (top-right) -->
    <rect x="0" y="-12" width="12" height="12" rx="6" fill="#A259FF"/>
    
    <!-- Blue Circle (middle-right) -->
    <circle cx="6" cy="6" r="6" fill="#1ABCFE"/>
    
    <!-- Background green rectangle -->
    <rect x="-12" y="12" width="12" height="12" rx="6" fill="#0ACF83"/>
  </g>
  
  <!-- Versão para tema escuro -->
  <style>
    @media (prefers-color-scheme: dark) {
      rect:first-of-type { fill: url(#bgDark) !important; stroke: #404040 !important; }
    }
  </style>
</svg>