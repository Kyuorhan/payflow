<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Definições para sombras e temas -->
  <defs>
    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    
    <!-- Gradiente para fundo light -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradiente para fundo dark -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo com gradiente e sombra -->
  <rect width="64" height="64" rx="12" fill="url(#bgLight)" 
        stroke="#e5e5e5" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Código de barras original centralizado -->
  <g transform="translate(32, 32) scale(0.35) translate(-50, 102)">
    <!-- Barras verticais cinzas -->
    <path d="M24 -126H27V-78H24V-126Z" fill="#B1B0B8"/>
    <path d="M18 -126H21V-78H18V-126Z" fill="#B1B0B8"/>
    <path d="M37 -126H39V-78H37V-126Z" fill="#B1B0B8"/>
    <path d="M42 -126H46V-78H42V-126Z" fill="#B1B0B8"/>
    <path d="M9 -126H14V-78H9V-126Z" fill="#B1B0B8"/>
    <path d="M30 -126H35V-78H30V-126Z" fill="#B1B0B8"/>
    <path d="M80 -78H76V-126H80V-78Z" fill="#B1B0B8"/>
    <path d="M85 -78H83V-126H85V-78Z" fill="#B1B0B8"/>
    <path d="M65 -78H63V-126H65V-78Z" fill="#B1B0B8"/>
    <path d="M52 -78H50V-126H52V-78Z" fill="#B1B0B8"/>
    <path d="M60 -78H56V-126H60V-78Z" fill="#B1B0B8"/>
    <path d="M93 -78H89V-126H93V-78Z" fill="#B1B0B8"/>
    <path d="M73 -78H68V-126H73V-78Z" fill="#B1B0B8"/>
    
    <!-- Barra horizontal central -->
    <path d="M101 -104V-100H0V-104H101Z" fill="#585666"/>
    
    <!-- Cantos decorativos laranja com maior espessura -->
    <path fill-rule="evenodd" clip-rule="evenodd" d="M0 -136H-4V-132V-120H0V-132L12 -132V-136H0Z" fill="#FF941A"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M101 -68L105 -68L105 -72L105 -84L101 -84L101 -72L89 -72L89 -68L101 -68Z" fill="#FF941A"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M105 -132L105 -136L101 -136L89 -136L89 -132L101 -132L101 -120L105 -120L105 -132Z" fill="#FF941A"/>
    <path fill-rule="evenodd" clip-rule="evenodd" d="M-4 -72L-4 -68L0 -68L12 -68L12 -72L0 -72L0 -84L-4 -84L-4 -72Z" fill="#FF941A"/>
  </g>
  
  <!-- Versão para tema escuro -->
  <style>
    @media (prefers-color-scheme: dark) {
      rect:first-of-type { fill: url(#bgDark) !important; stroke: #404040 !important; }
      path[fill="#B1B0B8"] { fill: #E5E5E5 !important; }
      path[fill="#585666"] { fill: #8A8A8A !important; }
    }
  </style>
</svg>