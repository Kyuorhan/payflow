<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F48FB1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" rx="12" fill="url(#bgLight)" 
        stroke="#e5e5e5" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Build Process Pipeline -->
  <g transform="translate(32, 32)">
    <!-- Pipeline flow -->
    <rect x="-16" y="-4" width="8" height="8" rx="2" fill="url(#buildGradient)"/>
    <text x="-12" y="1" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#ffffff" text-anchor="middle">SRC</text>
    
    <!-- Arrow 1 -->
    <path d="M-6,-2 L-2,-2 L-4,-4 M-2,-2 L-4,0" stroke="url(#buildGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Build processor -->
    <circle cx="4" cy="0" r="6" fill="url(#buildGradient)"/>
    <circle cx="4" cy="0" r="3" fill="#ffffff" opacity="0.8"/>
    <rect x="2" y="-1" width="4" height="2" fill="url(#buildGradient)"/>
    
    <!-- Arrow 2 -->
    <path d="M12,-2 L16,-2 L14,-4 M16,-2 L14,0" stroke="url(#buildGradient)" stroke-width="2" fill="none" stroke-linecap="round"/>
    
    <!-- Output apps -->
    <g transform="translate(20, -6)">
      <!-- iOS app -->
      <rect x="-2" y="0" width="4" height="6" rx="1" fill="url(#buildGradient)" opacity="0.8"/>
      <circle cx="0" cy="1" r="0.5" fill="#ffffff"/>
      <rect x="-1" y="2" width="2" height="1" fill="#ffffff" opacity="0.7"/>
      <text x="0" y="9" font-family="Arial, sans-serif" font-size="4" fill="url(#buildGradient)" text-anchor="middle">iOS</text>
    </g>
    
    <g transform="translate(20, 4)">
      <!-- Android app -->
      <rect x="-2" y="0" width="4" height="6" rx="1" fill="url(#buildGradient)" opacity="0.8"/>
      <circle cx="0" cy="1" r="0.5" fill="#ffffff"/>
      <rect x="-1" y="2" width="2" height="1" fill="#ffffff" opacity="0.7"/>
      <text x="0" y="9" font-family="Arial, sans-serif" font-size="4" fill="url(#buildGradient)" text-anchor="middle">APK</text>
    </g>
    
    <!-- Build progress indicators -->
    <circle cx="-12" cy="-10" r="1.5" fill="#4CAF50"/>
    <circle cx="4" cy="-10" r="1.5" fill="#FF9800"/>
    <circle cx="20" cy="-10" r="1.5" fill="#E91E63"/>
  </g>
  
  <style>
    @media (prefers-color-scheme: dark) {
      rect:first-child { fill: url(#bgDark) !important; stroke: #404040 !important; }
    }
  </style>
</svg>
