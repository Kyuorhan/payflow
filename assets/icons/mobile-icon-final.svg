<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Mobile Icon padronizado -->
  <defs>
    <linearGradient id="mobile-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667EEA"/>
      <stop offset="100%" style="stop-color:#764BA2"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#mobile-gradient)"/>
  
  <!-- Mobile Phone -->
  <rect x="20" y="8" width="24" height="42" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Screen -->
  <rect x="22" y="14" width="20" height="28" rx="2" fill="#1F2937"/>
  
  <!-- Home indicator (modern phones) -->
  <rect x="28" y="46" width="8" height="2" rx="1" fill="#9CA3AF"/>
  
  <!-- Screen content - app icons -->
  <rect x="24" y="16" width="3" height="3" rx="0.5" fill="#3B82F6"/>
  <rect x="28" y="16" width="3" height="3" rx="0.5" fill="#10B981"/>
  <rect x="32" y="16" width="3" height="3" rx="0.5" fill="#F59E0B"/>
  <rect x="36" y="16" width="3" height="3" rx="0.5" fill="#EF4444"/>
  
  <!-- More app icons -->
  <rect x="24" y="21" width="3" height="3" rx="0.5" fill="#8B5CF6"/>
  <rect x="28" y="21" width="3" height="3" rx="0.5" fill="#06B6D4"/>
  <rect x="32" y="21" width="3" height="3" rx="0.5" fill="#84CC16"/>
  <rect x="36" y="21" width="3" height="3" rx="0.5" fill="#F97316"/>
  
  <!-- Status bar -->
  <rect x="24" y="52" width="16" height="4" rx="2" fill="#374151"/>
  
  <!-- Signal/battery indicators -->
  <circle cx="26" cy="54" r="0.5" fill="#10B981"/>
  <circle cx="28" cy="54" r="0.5" fill="#10B981"/>
  <circle cx="30" cy="54" r="0.5" fill="#10B981"/>
  <rect x="36" y="53" width="3" height="2" rx="0.3" fill="#10B981"/>
</svg>
