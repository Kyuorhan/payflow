<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Definições para sombras e temas -->
  <defs>
    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    
    <!-- Máscara para criar letra transparente -->
    <mask id="textMask">
      <rect width="64" height="64" fill="white"/>
      <text x="32" y="40" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" fill="black" font-weight="bold">TS</text>
    </mask>
  </defs>
  
  <!-- Fundo azul com sombra -->
  <rect width="64" height="64" rx="12" fill="#3178C6" 
        stroke="#3178C6" stroke-width="1" filter="url(#shadow)" mask="url(#textMask)"/>
</svg>
