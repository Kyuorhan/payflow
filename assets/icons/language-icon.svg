<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="languageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#66BB6A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" rx="12" fill="url(#bgLight)" 
        stroke="#e5e5e5" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Code brackets and slash -->
  <g transform="translate(32, 32)">
    <!-- Opening bracket < -->
    <path d="M-12,-8 L-18,-2 L-18,2 L-12,8" stroke="url(#languageGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Closing bracket > -->
    <path d="M12,-8 L18,-2 L18,2 L12,8" stroke="url(#languageGradient)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Forward slash / -->
    <line x1="-2" y1="12" x2="2" y2="-12" stroke="url(#languageGradient)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- TypeScript 'TS' inside -->
    <text x="-6" y="2" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="url(#languageGradient)" text-anchor="middle">TS</text>
  </g>
  
  <style>
    @media (prefers-color-scheme: dark) {
      rect:first-child { fill: url(#bgDark) !important; stroke: #404040 !important; }
    }
  </style>
</svg>
