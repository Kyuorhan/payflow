<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="12" fill="url(#bgLight)" stroke="#e5e5e5" stroke-width="1" filter="url(#shadow)"/>

  <!-- Apple Logo -->
  <g transform="translate(32,32) scale(1.2)">
    <path d="M4,-10 C2,-12 0,-12 -2,-10 C-4,-8 -6,-6 -6,-2 C-6,2 -4,6 -2,8 C0,10 2,10 4,8 C6,6 8,2 8,-2 C8,-6 6,-8 4,-10 Z" fill="#000000"/>
    <path d="M2,-14 C1,-15 0,-15 -1,-14 C-2,-13 -2,-12 -1,-11 C0,-10 1,-10 2,-11 C3,-12 3,-13 2,-14 Z" fill="#000000"/>
  </g>

  <style>
    @media (prefers-color-scheme: dark) {
      rect { fill: url(#bgDark) !important; stroke: #404040 !important; }
    }
  </style>
</svg>
