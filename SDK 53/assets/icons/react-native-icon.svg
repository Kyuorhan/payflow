<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" rx="12" fill="url(#bgLight)" 
        stroke="#e5e5e5" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Logo React Native oficial -->
  <g transform="translate(32, 32)">
    <!-- Átomo central -->
    <circle cx="0" cy="0" r="3" fill="#61DAFB"/>
    <!-- Órbitas -->
    <ellipse cx="0" cy="0" rx="18" ry="7" fill="none" stroke="#61DAFB" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="18" ry="7" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="18" ry="7" fill="none" stroke="#61DAFB" stroke-width="2" transform="rotate(120)"/>
    <!-- Elétrons -->
    <circle cx="18" cy="0" r="2" fill="#61DAFB"/>
    <circle cx="-9" cy="15.6" r="2" fill="#61DAFB"/>
    <circle cx="-9" cy="-15.6" r="2" fill="#61DAFB"/>
  </g>
  
  <style>
    @media (prefers-color-scheme: dark) {
      rect { fill: url(#bgDark) !important; stroke: #404040 !important; }
    }
  </style>
</svg>