<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mobileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A29BFE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" rx="12" fill="url(#bgLight)" 
        stroke="#e5e5e5" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Mobile Device -->
  <g transform="translate(32, 32)">
    <!-- Phone body -->
    <rect x="-8" y="-16" width="16" height="32" rx="4" fill="none" stroke="url(#mobileGradient)" stroke-width="2"/>
    
    <!-- Screen -->
    <rect x="-6" y="-12" width="12" height="20" rx="2" fill="url(#mobileGradient)" opacity="0.3"/>
    
    <!-- Home button -->
    <circle cx="0" cy="12" r="2" fill="url(#mobileGradient)"/>
    
    <!-- Speaker -->
    <rect x="-3" y="-14" width="6" height="1" rx="0.5" fill="url(#mobileGradient)"/>
    
    <!-- App icons on screen -->
    <rect x="-4" y="-10" width="2" height="2" rx="0.5" fill="#ffffff"/>
    <rect x="-1" y="-10" width="2" height="2" rx="0.5" fill="#ffffff"/>
    <rect x="2" y="-10" width="2" height="2" rx="0.5" fill="#ffffff"/>
    <rect x="-4" y="-7" width="2" height="2" rx="0.5" fill="#ffffff"/>
    <rect x="-1" y="-7" width="2" height="2" rx="0.5" fill="#ffffff"/>
    <rect x="2" y="-7" width="2" height="2" rx="0.5" fill="#ffffff"/>
  </g>
  
  <style>
    @media (prefers-color-scheme: dark) {
      rect:first-child { fill: url(#bgDark) !important; stroke: #404040 !important; }
    }
  </style>
</svg>
