<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="navigationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" rx="12" fill="url(#bgLight)" 
        stroke="#e5e5e5" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Router/Navigation Network -->
  <g transform="translate(32, 32)">
    <!-- Central router/hub -->
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="url(#navigationGradient)"/>
    <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#ffffff" opacity="0.8"/>
    
    <!-- Router indicator lights -->
    <circle cx="-2" cy="-2" r="0.8" fill="#FF9800"/>
    <circle cx="0" cy="-2" r="0.8" fill="#4CAF50"/>
    <circle cx="2" cy="-2" r="0.8" fill="#2196F3"/>
    
    <!-- Network connections/routes -->
    <path d="M6,0 L14,0" stroke="url(#navigationGradient)" stroke-width="2" stroke-linecap="round"/>
    <path d="M-6,0 L-14,0" stroke="url(#navigationGradient)" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,-6 L0,-14" stroke="url(#navigationGradient)" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,6 L0,14" stroke="url(#navigationGradient)" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Network nodes -->
    <circle cx="14" cy="0" r="3" fill="url(#navigationGradient)" opacity="0.7"/>
    <circle cx="-14" cy="0" r="3" fill="url(#navigationGradient)" opacity="0.7"/>
    <circle cx="0" cy="-14" r="3" fill="url(#navigationGradient)" opacity="0.7"/>
    <circle cx="0" cy="14" r="3" fill="url(#navigationGradient)" opacity="0.7"/>
    
    <!-- Signal waves -->
    <path d="M8,-8 Q12,-4 8,0" stroke="url(#navigationGradient)" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M-8,-8 Q-12,-4 -8,0" stroke="url(#navigationGradient)" stroke-width="1.5" fill="none" opacity="0.6"/>
  </g>
  
  <style>
    @media (prefers-color-scheme: dark) {
      rect:first-child { fill: url(#bgDark) !important; stroke: #404040 !important; }
    }
  </style>
</svg>
