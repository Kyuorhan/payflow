<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="12" fill="url(#bgLight)" stroke="#e5e5e5" stroke-width="1" filter="url(#shadow)"/>

  <!-- Android Head -->
  <g transform="translate(32,32) scale(1.2)">
    <path d="M-10,-6 C-10,-10 -6,-14 0,-14 C6,-14 10,-10 10,-6 C10,-2 6,2 0,2 C-6,2 -10,-2 -10,-6 Z" fill="#3DDC84"/>
    <circle cx="-4" cy="-8" r="1.5" fill="#ffffff"/>
    <circle cx="4" cy="-8" r="1.5" fill="#ffffff"/>
  </g>

  <style>
    @media (prefers-color-scheme: dark) {
      rect { fill: url(#bgDark) !important; stroke: #404040 !important; }
    }
  </style>
</svg>
