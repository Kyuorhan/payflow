<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="figma-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1E1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D2D2D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="payflow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A29BFE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#figma-bg)"/>
  
  <!-- Figma Header -->
  <rect x="0" y="0" width="800" height="48" fill="#2C2C2C"/>
  
  <!-- Figma Logo -->
  <circle cx="24" cy="24" r="8" fill="#F24E1E"/>
  <text x="44" y="28" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Figma Community</text>
  
  <!-- File Info -->
  <rect x="200" y="12" width="400" height="24" fill="#3C3C3C" rx="4"/>
  <text x="210" y="26" fill="#fff" font-family="Arial, sans-serif" font-size="12">PayFlow - Design System</text>
  
  <!-- Canvas Area -->
  <rect x="0" y="48" width="800" height="402" fill="#1E1E1E"/>
  
  <!-- Left Sidebar -->
  <rect x="0" y="48" width="240" height="402" fill="#2C2C2C"/>
  
  <!-- Layers Panel -->
  <text x="16" y="72" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Layers</text>
  
  <!-- Layer Items -->
  <rect x="16" y="88" width="208" height="24" fill="#3C3C3C" rx="4"/>
  <circle cx="28" cy="100" r="6" fill="#6C5CE7"/>
  <text x="44" y="104" fill="#fff" font-family="Arial, sans-serif" font-size="11">📱 PayFlow App</text>
  
  <rect x="16" y="120" width="208" height="24" fill="#484848" rx="4"/>
  <circle cx="28" cy="132" r="6" fill="#4CAF50"/>
  <text x="44" y="136" fill="#fff" font-family="Arial, sans-serif" font-size="11">🏠 Home Screen</text>
  
  <rect x="16" y="152" width="208" height="24" fill="#484848" rx="4"/>
  <circle cx="28" cy="164" r="6" fill="#FF9800"/>
  <text x="44" y="168" fill="#fff" font-family="Arial, sans-serif" font-size="11">💳 Scan Screen</text>
  
  <rect x="16" y="184" width="208" height="24" fill="#484848" rx="4"/>
  <circle cx="28" cy="196" r="6" fill="#E91E63"/>
  <text x="44" y="200" fill="#fff" font-family="Arial, sans-serif" font-size="11">📊 Dashboard</text>
  
  <!-- Main Canvas -->
  <rect x="240" y="48" width="560" height="402" fill="#0F0F0F"/>
  
  <!-- Device Frame -->
  <rect x="360" y="98" width="200" height="350" fill="#000" rx="25"/>
  <rect x="370" y="108" width="180" height="330" fill="#fff" rx="20"/>
  
  <!-- Screen Content -->
  <!-- Header -->
  <rect x="370" y="108" width="180" height="60" fill="url(#payflow-gradient)"/>
  <text x="450" y="135" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PayFlow</text>
  <circle cx="390" cy="130" r="3" fill="rgba(255,255,255,0.7)"/>
  <circle cx="400" cy="130" r="3" fill="rgba(255,255,255,0.7)"/>
  <circle cx="410" cy="130" r="3" fill="rgba(255,255,255,0.7)"/>
  
  <!-- Cards -->
  <rect x="385" y="180" width="150" height="40" fill="#F5F5F5" rx="8"/>
  <rect x="395" y="190" width="60" height="4" fill="#6C5CE7" rx="2"/>
  <rect x="395" y="200" width="80" height="4" fill="#E0E0E0" rx="2"/>
  <rect x="395" y="210" width="40" height="4" fill="#E0E0E0" rx="2"/>
  
  <rect x="385" y="230" width="150" height="40" fill="#F5F5F5" rx="8"/>
  <rect x="395" y="240" width="60" height="4" fill="#A29BFE" rx="2"/>
  <rect x="395" y="250" width="80" height="4" fill="#E0E0E0" rx="2"/>
  <rect x="395" y="260" width="40" height="4" fill="#E0E0E0" rx="2"/>
  
  <rect x="385" y="280" width="150" height="40" fill="#F5F5F5" rx="8"/>
  <rect x="395" y="290" width="60" height="4" fill="#74B9FF" rx="2"/>
  <rect x="395" y="300" width="80" height="4" fill="#E0E0E0" rx="2"/>
  <rect x="395" y="310" width="40" height="4" fill="#E0E0E0" rx="2"/>
  
  <!-- Bottom Navigation -->
  <rect x="385" y="390" width="150" height="30" fill="#F8F9FA" rx="4"/>
  <circle cx="410" cy="405" r="4" fill="#6C5CE7"/>
  <circle cx="435" cy="405" r="4" fill="#E0E0E0"/>
  <circle cx="460" cy="405" r="4" fill="#E0E0E0"/>
  <circle cx="485" cy="405" r="4" fill="#E0E0E0"/>
  <circle cx="510" cy="405" r="4" fill="#E0E0E0"/>
  
  <!-- Properties Panel -->
  <rect x="570" y="48" width="230" height="402" fill="#2C2C2C"/>
  <text x="586" y="72" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Design</text>
  
  <!-- Property Items -->
  <rect x="586" y="88" width="198" height="32" fill="#3C3C3C" rx="4"/>
  <text x="596" y="100" fill="#ccc" font-family="Arial, sans-serif" font-size="10">Fill</text>
  <rect x="596" y="104" width="16" height="12" fill="#6C5CE7" rx="2"/>
  <text x="620" y="112" fill="#fff" font-family="Arial, sans-serif" font-size="10">#6C5CE7</text>
  
  <rect x="586" y="128" width="198" height="32" fill="#3C3C3C" rx="4"/>
  <text x="596" y="140" fill="#ccc" font-family="Arial, sans-serif" font-size="10">Corner Radius</text>
  <text x="596" y="152" fill="#fff" font-family="Arial, sans-serif" font-size="10">8px</text>
  
  <rect x="586" y="168" width="198" height="32" fill="#3C3C3C" rx="4"/>
  <text x="596" y="180" fill="#ccc" font-family="Arial, sans-serif" font-size="10">Typography</text>
  <text x="596" y="192" fill="#fff" font-family="Arial, sans-serif" font-size="10">Roboto Medium 16px</text>
  
  <!-- Community Badge -->
  <rect x="600" y="350" width="120" height="32" fill="#F24E1E" rx="6"/>
  <text x="650" y="370" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Community File</text>
  
  <!-- Interaction Hint -->
  <text x="400" y="30" fill="#74B9FF" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">👆 Clique para navegar pelo protótipo</text>
</svg>
