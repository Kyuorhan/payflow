<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="react-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#61DAFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#21D4FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Phone Frame -->
  <rect x="12" y="6" width="24" height="36" rx="6" fill="url(#react-gradient)" stroke="#fff" stroke-width="2"/>
  <rect x="15" y="12" width="18" height="24" rx="2" fill="#fff"/>
  
  <!-- React Atom -->
  <circle cx="24" cy="24" r="2" fill="#61DAFB"/>
  
  <!-- Electron Orbits -->
  <ellipse cx="24" cy="24" rx="8" ry="3" stroke="#61DAFB" stroke-width="1.5" fill="none" transform="rotate(0 24 24)"/>
  <ellipse cx="24" cy="24" rx="8" ry="3" stroke="#61DAFB" stroke-width="1.5" fill="none" transform="rotate(60 24 24)"/>
  <ellipse cx="24" cy="24" rx="8" ry="3" stroke="#61DAFB" stroke-width="1.5" fill="none" transform="rotate(120 24 24)"/>
  
  <!-- Status indicators -->
  <circle cx="24" cy="9" r="1.5" fill="#4CAF50"/>
  <rect x="20" y="38" width="8" height="2" rx="1" fill="#E0E0E0"/>
</svg>
